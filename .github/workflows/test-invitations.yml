name: Test Firebase surveyor invitations
on:
  workflow_dispatch:
  push:
    paths:
      - firestore.rules
      - firebase.json
      - tests/firestore-invites.test.mjs
      - .github/workflows/test-invitations.yml
permissions:
  contents: read
  issues: write
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test tools
        run: npm install --no-save --no-audit --no-fund firebase@13.3.0 firebase-tools@15.37.0 @firebase/rules-unit-testing@6.0.0
      - name: Run isolated Firestore rules tests
        id: invitationtests
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-budleaf-invites --only firestore "node --test tests/firestore-invites.test.mjs" 2>&1 | tee "$RUNNER_TEMP/invitation-tests.log"
      - name: Report private invitation test diagnostics
        if: ${{ failure() && steps.invitationtests.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Invite surveyor Firestore permissions: latest failed test"
          {
            echo "Rules test failed in [GitHub Actions run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "\`\`\`text"
            tail -n 110 "$RUNNER_TEMP/invitation-tests.log"
            echo "\`\`\`"
          } > "$RUNNER_TEMP/invitation-test-report.md"
          number=$(gh issue list --state open --search '"Invite surveyor Firestore permissions: latest failed test" in:title' --json number,title --jq '.[] | select(.title == "Invite surveyor Firestore permissions: latest failed test") | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/invitation-test-report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/invitation-test-report.md"
          fi
