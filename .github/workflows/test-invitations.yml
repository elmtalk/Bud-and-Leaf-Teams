name: Test Firebase surveyor invitations
on:
  workflow_dispatch:
  push:
    paths:
      - firestore.rules
      - firebase.json
      - tests/firestore-invites.test.mjs
      - .github/workflows/test-invitations.yml
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test tools
        run: npm install --no-save --no-audit --no-fund firebase@13.3.0 firebase-tools@15.37.0 @firebase/rules-unit-testing@6.0.0
      - name: Run isolated Firestore rules tests
        run: npx firebase emulators:exec --project demo-budleaf-invites --only firestore "node --test tests/firestore-invites.test.mjs"
